name: accounic
description: Accounic — personal accounting for Android and Windows, on one Supabase backend.
publish_to: "none"
version: 1.0.4+5

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend. The same PostgREST + RLS + RPC surface the web client uses
  # (context.md §21) — no separate mobile API.
  supabase_flutter: ^2.8.0

  # State. Riverpod keeps the repository layer free of Flutter imports, which is
  # what lets the accounting models be unit-tested without a widget tree.
  flutter_riverpod: ^2.6.1

  # Routing with real URLs, so desktop deep links and Android back behave.
  go_router: ^14.6.1

  # Currency and date formatting driven by the profile's currency code.
  intl: ^0.19.0

  # Entrance and stagger effects. Everything it does could be hand-rolled with
  # AnimationController, but the hand-rolled version is a StatefulWidget per
  # animation; this keeps the motion declarative and the widgets const.
  flutter_animate: ^4.5.0
  lucide_icons_flutter: ^3.1.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  # Poppins carries the brand and the headings, exactly as on the web. Body text
  # deliberately uses the platform face (Roboto on Android, Segoe UI on Windows)
  # rather than shipping a second megabyte of font to a phone for a role the
  # system already fills well — see docs/decisions.md.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
