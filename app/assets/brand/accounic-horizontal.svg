<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" role="img" aria-label="Accounic">
  <title>Accounic horizontal logo</title>
  <!-- Icon plus wordmark, optically aligned on the wordmark's cap height. -->
  <defs>
    <linearGradient id="hGradient" x1="0.08" y1="0.02" x2="0.94" y2="0.98">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="0.22" stop-color="#2563EB"/>
      <stop offset="0.45" stop-color="#0EA5E9"/>
      <stop offset="0.58" stop-color="#06B6D4"/>
      <stop offset="0.78" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="hWord" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="0.5" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <g transform="translate(12 14) scale(0.53)">
    <path d="M96 414 L256 104 L416 414" fill="none" stroke="url(#hGradient)"
          stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="178" y="362" width="36" height="52" rx="9" fill="#2563EB"/>
    <rect x="228" y="322" width="36" height="92" rx="9" fill="#06B6D4"/>
    <rect x="278" y="278" width="36" height="136" rx="9" fill="#22C55E"/>
    <path d="M172 356 Q 250 350 300 268" fill="none" stroke="#0F2A5B"
          stroke-width="15" stroke-linecap="round"/>
    <path d="M325 244 L309 279 L290 254 Z" fill="#0F2A5B"/>
  </g>

  <text x="300" y="205"
        font-family="Poppins, Inter, Segoe UI, system-ui, sans-serif"
        font-size="140" font-weight="600" letter-spacing="-2.5" fill="#111C3A">Accoun</text>
  <text x="785" y="205"
        font-family="Poppins, Inter, Segoe UI, system-ui, sans-serif"
        font-size="140" font-weight="600" letter-spacing="-2.5" fill="url(#hWord)">ic</text>
</svg>
