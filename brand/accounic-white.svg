<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" role="img" aria-label="Accounic">
  <title>Accounic horizontal logo, white — for dark backgrounds</title>
  <!--
    Single-colour version. Everything is pure white, arrow included, so the mark
    holds up on photography and on any dark surface where the gradient would
    lose contrast against the ground.
  -->
  <g transform="translate(12 14) scale(0.53)">
    <path d="M96 414 L256 104 L416 414" fill="none" stroke="#FFFFFF"
          stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="178" y="362" width="36" height="52" rx="9" fill="#FFFFFF"/>
    <rect x="228" y="322" width="36" height="92" rx="9" fill="#FFFFFF"/>
    <rect x="278" y="278" width="36" height="136" rx="9" fill="#FFFFFF"/>
    <path d="M172 356 Q 250 350 300 268" fill="none" stroke="#FFFFFF"
          stroke-width="15" stroke-linecap="round"/>
    <path d="M325 244 L309 279 L290 254 Z" fill="#FFFFFF"/>
  </g>
  <text x="300" y="205"
        font-family="Poppins, Inter, Segoe UI, system-ui, sans-serif"
        font-size="140" font-weight="600" letter-spacing="-2.5" fill="#FFFFFF">Accounic</text>
</svg>
