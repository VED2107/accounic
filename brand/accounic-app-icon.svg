<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Accounic">
  <title>Accounic app icon</title>
  <!--
    Rounded square on the deep ink ground. The mark is scaled to 72% and
    centred so it keeps optical margin inside the platform's icon mask.
  -->
  <defs>
    <linearGradient id="appGradient" x1="0.08" y1="0.02" x2="0.94" y2="0.98">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.32" stop-color="#0EA5E9"/>
      <stop offset="0.58" stop-color="#06B6D4"/>
      <stop offset="0.78" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="appBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101A30"/>
      <stop offset="1" stop-color="#0A1120"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#appBg)"/>

  <g transform="translate(256 262) scale(0.72) translate(-256 -256)">
    <path d="M96 414 L256 104 L416 414" fill="none" stroke="url(#appGradient)"
          stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="178" y="362" width="36" height="52" rx="9" fill="#2563EB"/>
    <rect x="228" y="322" width="36" height="92" rx="9" fill="#06B6D4"/>
    <rect x="278" y="278" width="36" height="136" rx="9" fill="#22C55E"/>
    <!-- White arrow: the navy version would vanish against this ground. -->
    <path d="M172 356 Q 250 350 300 268" fill="none" stroke="#FFFFFF"
          stroke-width="15" stroke-linecap="round"/>
    <path d="M325 244 L309 279 L290 254 Z" fill="#FFFFFF"/>
  </g>
</svg>
