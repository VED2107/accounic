# The Accounic demo, as applications.
#
# There is no Flutter Web build, of the demo or of anything else. The Flutter
# codebase targets Android and Windows; the web client is the Next.js
# application in `web/`. So the demo is distributed the way the product is:
# something you install (docs/demo.md).
#
# These are the SAME builds the release workflow produces, with one extra
# dart-define — DEMO_MODE=on — and they point at the same Supabase project,
# because there is one database and one accounting engine. What separates a
# demo visitor from a customer is `profiles.is_demo` and RLS, not a backend.
#
# The `demo` in each file name is load-bearing: `UpdateRepository` matches on it
# so a demo visitor is never offered the production installer and a paying user
# is never offered the demo.
#
# Secrets are the release workflow's own — SUPABASE_URL and SUPABASE_ANON_KEY.
# The anon key is publishable by design and everything it can do is bounded by
# RLS. The service-role key has no business here, is not read here, and must
# never be added.
name: demo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # To attach the demo builds to the release the tag created.
  contents: write

env:
  # The same pin the flutter and release workflows use. A demo built on a
  # toolchain no release was built with is a demo of something nobody ships.
  FLUTTER_VERSION: 3.29.3

jobs:
  android:
    name: demo apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Refuse to build without credentials
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY must be set as repository secrets."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build
        run: |
          flutter build apk --release \
            --dart-define=DEMO_MODE=on \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/Accounic-demo-${GITHUB_REF_NAME#v}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/Accounic-demo-*.apk

  windows:
    name: demo windows
    # windows-2022, not windows-latest, for the reason release.yml states: the
    # newer image ships a Visual Studio that Flutter 3.29 does not recognise, so
    # toolchain detection falls back to "Visual Studio 16 2019" and CMake fails
    # with "could not find any instance of Visual Studio". This workflow learned
    # that the hard way on v1.13.1.
    runs-on: windows-2022
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build
        run: |
          flutter build windows --release `
            --dart-define=DEMO_MODE=on `
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} `
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      # Both, for the same reason the production build ships both: an installer
      # for somebody who wants Accounic Demo in their Start Menu, and a zip for
      # somebody who wants to try it without installing anything.
      #
      # accounic-demo.iss carries its own AppId, folder and name, so installing
      # the demo beside a real Accounic disturbs neither. The whole Release
      # directory is packaged either way: the engine DLL, the plugin DLLs and
      # data\ are all required, and the exe alone will not start.
      - name: Compile the installer
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          choco install innosetup --no-progress -y

          # Found, not assumed — the same spelling problem release.yml
          # documents: ${env:ProgramFiles(x86)} is the correct form, and Inno
          # Setup lands in any of these depending on the install layout.
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found. Looked in: $($candidates -join '; ')" }

          $version = "${{ github.ref_name }}" -replace '^v', ''
          & $iscc app\windows\installer\accounic-demo.iss /DAppVersion=$version

      - name: Portable zip
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          New-Item -ItemType Directory -Force app\build\installer | Out-Null
          Compress-Archive -Force -Path app\build\windows\x64\runner\Release\* `
            -DestinationPath "app\build\installer\Accounic-Demo-$version-windows-x64.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/installer/Accounic-Demo-Setup-*-x64.exe
            app/build/installer/Accounic-Demo-*-windows-x64.zip
