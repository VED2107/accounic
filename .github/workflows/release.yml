# Cutting a release.
#
# docs/deployment.md §4–§5 describes this as a sequence of commands somebody
# runs on their own machine, and every release so far was cut that way. The
# steps are unchanged here — same builds, same installer script, same
# arguments — they simply run on a runner and attach what they produce to the
# GitHub Release, which is where both clients' update check looks.
#
#   git tag v1.9.0 && git push origin v1.9.0
#
# or run it by hand from the Actions tab with a tag name.
#
# WHAT THIS DELIBERATELY DOES NOT CHANGE: the APK's signing. The release build
# still uses the debug keystore (android/app/build.gradle.kts), exactly as it
# has for every release — fine for sideloading, wrong for the Play Store, and
# not a decision to make silently inside a CI file. docs/PROGRESS.md §7.3 has
# the full note.
#
# TWO SECRETS ARE REQUIRED, and the workflow fails early and says so if they
# are missing. They are the same two public values the binaries already ship:
#
#   SUPABASE_URL         https://<project>.supabase.co
#   SUPABASE_ANON_KEY    the publishable (anon) key
#
# Add them under Settings → Secrets and variables → Actions.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.9.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.29.3

jobs:
  guard:
    name: check the release secrets exist
    runs-on: ubuntu-latest
    steps:
      # A build with empty dart-defines produces a binary that starts and then
      # tells the user it is misconfigured (app/lib/core/config.dart). Better to
      # fail here, where only the maintainer sees it.
      - name: Supabase values are present
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY must be set as repository secrets."
            exit 1
          fi
          echo "Both secrets are set."

  version:
    name: read the version
    runs-on: ubuntu-latest
    needs: guard
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # The installer and the filenames want 1.9.0; the tag is v1.9.0. Taken
      # from pubspec.yaml rather than from the tag, so a tag that disagrees with
      # the app's own version is caught before anything is published.
      - id: read
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PUBSPEC=$(grep '^version:' app/pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PUBSPEC" >> "$GITHUB_OUTPUT"

          if [ "$TAG" != "v$PUBSPEC" ]; then
            echo "::error::Tag $TAG does not match app/pubspec.yaml version $PUBSPEC. Bump the pubspec first — the number after + is Android's versionCode, and an APK that does not raise it cannot install over a copy already on a device."
            exit 1
          fi
          echo "Building $TAG from pubspec $PUBSPEC."

  android:
    name: APK
    runs-on: ubuntu-latest
    needs: version
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Signed with the debug keystore, as every release has been. Unchanged
      # here on purpose — see the header.
      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Name it after the release
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/Accounic-${{ needs.version.outputs.version }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: app/build/app/outputs/flutter-apk/Accounic-${{ needs.version.outputs.version }}.apk
          if-no-files-found: error

  windows:
    name: installer and portable zip
    runs-on: windows-latest
    needs: version
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build the desktop binary
        run: |
          flutter build windows --release `
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} `
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      # The installer packages the WHOLE Release directory — the exe, the engine
      # DLL, the plugin DLLs and data\ (ICU data, assets, the AOT snapshot).
      # Shipping the exe alone produces a binary that will not start.
      - name: Compile the installer
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          choco install innosetup --no-progress -y
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" `
              app\windows\installer\accounic.iss `
              /DAppVersion=${{ needs.version.outputs.version }}

      - name: Portable zip
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          New-Item -ItemType Directory -Force app\build\installer | Out-Null
          Compress-Archive -Force -Path app\build\windows\x64\runner\Release\* `
            -DestinationPath app\build\installer\Accounic-${{ needs.version.outputs.version }}-windows-x64-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            app/build/installer/Accounic-Setup-${{ needs.version.outputs.version }}-x64.exe
            app/build/installer/Accounic-${{ needs.version.outputs.version }}-windows-x64-portable.zip
          if-no-files-found: error

  publish:
    name: publish the release
    runs-on: ubuntu-latest
    needs: [version, android, windows]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: What was built
        run: find artifacts -type f -printf '%p  %s bytes\n'

      # Draft, not published. Both clients' update check reads the Releases API
      # and will offer whatever is published, so a human decides the moment that
      # happens — and writes the notes, which no workflow can do honestly.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Accounic ${{ needs.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
          body: |
            Windows installer, Windows portable zip, and an Android APK.

            **The APK is debug-signed**, as every Accounic release has been: fine
            for sideloading, wrong for the Play Store. See docs/PROGRESS.md §7.3.

            Migrations in this release must be applied to the project before the
            clients are updated — see docs/deployment.md.
