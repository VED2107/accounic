# Web verification. Mirrors what docs/PROGRESS.md §5 records as the manual
# check: typecheck, tests, production build — in that order, all blocking.
name: web

on:
  push:
  pull_request:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      # Node 24, matching the machine the lockfile is written on. npm 10 and
      # npm 11 disagree about which optional platform packages belong in a
      # lockfile, and `npm ci` treats that disagreement as a fatal mismatch.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The build needs the two public Supabase values to exist, not to be
      # valid: no page fetches at build time. Real values are Vercel's.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_TELEMETRY_DISABLED: '1'
